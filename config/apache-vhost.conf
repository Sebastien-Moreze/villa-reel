<IfModule mod_ssl.c>
  <VirtualHost *:80>
    ServerName villareel.fr
    ServerAlias www.villareel.fr

    # Redirection HTTP -> HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/villa-reel-error.log
    CustomLog ${APACHE_LOG_DIR}/villa-reel-access.log combined
  </VirtualHost>

  <VirtualHost *:443>
    ServerName villareel.fr
    ServerAlias www.villareel.fr

    # Logs
    ErrorLog ${APACHE_LOG_DIR}/villa-reel-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/villa-reel-ssl-access.log combined

    # SSL (Let's Encrypt)
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/villareel.fr/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/villareel.fr/privkey.pem

    # Proxy vers l'application Next.js (container sur localhost:3000)
    ProxyPreserveHost On
    ProxyRequests Off

    <Location />
      ProxyPass http://127.0.0.1:3000/
      ProxyPassReverse http://127.0.0.1:3000/
    </Location>

    # En-têtes de sécurité
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"

    # Content Security Policy (à adapter selon les besoins front / scripts externes)
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data: https:; connect-src 'self' https:; frame-ancestors 'self'; upgrade-insecure-requests;"

    # Compression gzip
    <IfModule mod_deflate.c>
      AddOutputFilterByType DEFLATE text/plain text/html text/xml text/css text/javascript application/javascript application/json application/xml application/xml+rss application/font-woff2
    </IfModule>

    # Cache statique
    <IfModule mod_expires.c>
      ExpiresActive On

      # Assets Next.js
      <Location "/_next/static/">
        ExpiresDefault "access plus 1 year"
        Header set Cache-Control "public, max-age=31536000, immutable"
      </Location>

      # Images
      <Location "/images/">
        ExpiresDefault "access plus 30 days"
        Header set Cache-Control "public, max-age=2592000"
      </Location>
    </IfModule>

    # Redirection www -> sans www (optionnelle)
    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^www\.villareel\.fr$ [NC]
    RewriteRule ^(.*)$ https://villareel.fr/$1 [L,R=301]

  </VirtualHost>
</IfModule>

