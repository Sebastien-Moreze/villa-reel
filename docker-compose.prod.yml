services:
  app:
    image: ghcr.io/sebastien-moreze/villa-reel:latest
    container_name: villa-reel-app
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    networks:
      - villa-reel-network

networks:
  villa-reel-network:
    driver: bridge

